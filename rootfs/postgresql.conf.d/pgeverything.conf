# PGEverything tuning. The authoritative shared_preload_libraries is also passed via
# the container `command:` (see docker-compose.yml) so it applies during init too.

shared_preload_libraries = 'timescaledb,age,pg_cron,pg_stat_statements,pgsodium'

# pg_cron background worker connects to this database (must exist = POSTGRES_DB).
cron.database_name = 'pgeverything'

# pgsodium — load the server root key from an external script (from PGE_VAULT_KEY), so the
# key lives in the container env, not the database. We use explicit AEAD, not transparent
# column encryption, so disable the masking event trigger.
pgsodium.getkey_script = '/usr/local/bin/pgsodium_getkey.sh'
pgsodium.enable_event_trigger = off

# Don't phone home.
timescaledb.telemetry_level = off

# Modest foundry defaults (fallbacks). docker-compose.yml passes these via `-c` from the
# PGE_SHARED_BUFFERS / PGE_WORK_MEM / PGE_MAX_CONNECTIONS env vars, which override these at
# runtime. Set shared_buffers to ~25% of RAM on bigger hosts.
max_connections = 100
shared_buffers = 256MB
work_mem = 16MB
