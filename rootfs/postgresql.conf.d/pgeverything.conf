# PGEverything tuning. The authoritative shared_preload_libraries is also passed via
# the container `command:` (see docker-compose.yml) so it applies during init too.

shared_preload_libraries = 'timescaledb,age,pg_cron,pg_stat_statements'

# pg_cron background worker connects to this database (must exist = POSTGRES_DB).
cron.database_name = 'pgeverything'

# Don't phone home.
timescaledb.telemetry_level = off

# Modest foundry defaults — override via `command:` for bigger hosts.
max_connections = 100
shared_buffers = 256MB
work_mem = 16MB
