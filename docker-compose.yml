services:
  pgeverything:
    build:
      context: .
    image: pgeverything:0.1.0
    container_name: pgeverything
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # If you change this, also update cron.database_name below to match (pg_cron
      # requires the two to be equal or first-boot init fails).
      POSTGRES_DB: ${POSTGRES_DB:-pgeverything}
      PGE_ENABLE_POSTGIS: ${PGE_ENABLE_POSTGIS:-false}
      # JWT signing secret for pgauth — CHANGE THIS. Consumed by 20-auth.sh at first boot,
      # not passed to postgres, so it never lands in postgresql.conf or the process args.
      PGE_JWT_SECRET: ${PGE_JWT_SECRET:-CHANGE-ME-INSECURE-DEV-SECRET}
      # Optional: set to enable direct logins as the non-superuser app_user role.
      PGE_APP_USER_PASSWORD: ${PGE_APP_USER_PASSWORD:-}
      # pgvault root key — read at startup by pgsodium's getkey script (kept out of the DB).
      # Generate with: openssl rand -hex 32. Unset uses an INSECURE dev key.
      PGE_VAULT_KEY: ${PGE_VAULT_KEY:-}
    # shared_preload_libraries must be set at startup (and during init), so pass it here.
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,age,pg_cron,pg_stat_statements,pgsodium
      - -c
      # Passed here (not just in conf.d) so pgsodium finds its key script during the
      # first-boot init temp server — otherwise it aborts on the default missing path.
      - pgsodium.getkey_script=/usr/local/bin/pgsodium_getkey.sh
      - -c
      - cron.database_name=pgeverything   # must equal POSTGRES_DB above
      - -c
      - timescaledb.telemetry_level=off
      # Memory tuning — override via .env. Set shared_buffers to ~25% of RAM.
      - -c
      - shared_buffers=${PGE_SHARED_BUFFERS:-256MB}
      - -c
      - work_mem=${PGE_WORK_MEM:-16MB}
      - -c
      - max_connections=${PGE_MAX_CONNECTIONS:-100}
    ports:
      - "${PGE_PORT:-5432}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pgeverything"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
